[project]
name = "ord-fastapi-demo"
version = "0.0.0"
description = "Demo FastAPI service showing ord-python's adapter, server, and CLI."
requires-python = ">=3.12"
# This demo is consumed via the parent repo's editable install
# (pip install -e ".[dev]" from the repo root). When ord-python is
# published to PyPI, add it here as a runtime dependency.

[tool.ord]
app = "main:app"

[tool.ord.api_resource]
ord_id = "sap.demo:apiResource:Greeter:v1"
title = "Demo Greeter Service"
short_description = "Returns a friendly hello."
description = "A tiny FastAPI service used to demonstrate ord-python's adapter, server router, and CLI."
part_of_package = "sap.demo:package:Default:v1"
version = "1.0.0"
visibility = "public"
release_status = "active"
